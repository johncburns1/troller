[project]
name = "troller"
version = "0.1.0"
description = "Autonomous GitHub issue resolution system using Temporal workflows and multi-agent AI orchestration"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "temporalio>=1.22.0",
    "anthropic[bedrock]>=0.77.0",
    "pygithub>=2.8.1",
    "claude-agent-sdk>=0.1.29",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "mypy>=1.19.0",
    "ruff>=0.15.0",
    "pre-commit>=4.5.0",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = true

[[tool.mypy.overrides]]
module = "temporalio.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[[tool.uv.index]]
authenticate = "always"
default      = true
name         = "artifactory"
url          = "https://artifactory.nordstrom.com/artifactory/api/pypi/pypi/simple"
